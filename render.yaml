# One-click deploy on Render (free web service). The API key is set in the Render dashboard.
services:
  - type: web
    name: polibuddy
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn server:app --host 0.0.0.0 --port $PORT --proxy-headers --forwarded-allow-ips='*'
    healthCheckPath: /healthz
    envVars:
      - key: PYTHON_VERSION
        value: "3.12.7"
      - key: LLM_API_KEY
        sync: false
      - key: LLM_BASE_URL
        value: https://api.groq.com/openai/v1
      - key: LLM_MODEL
        value: openai/gpt-oss-120b
      - key: LLM_REASONING_EFFORT
        value: low
      - key: LLM_VISION_MODEL
        value: meta-llama/llama-4-scout-17b-16e-instruct
      - key: STT_MODEL
        value: whisper-large-v3-turbo
      - key: RATE_LIMIT_PER_MINUTE
        value: "12"
      - key: DAILY_LLM_CALLS
        value: "600"
